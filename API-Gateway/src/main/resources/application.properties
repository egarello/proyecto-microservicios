server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true         # 🔁 Usar Eureka para descubrir rutas
          lower-case-service-id: true
      routes:
        - id: usuario-server
          uri: lb://usuario-server
          predicates:
            - Path=/api/usuarios/**
        - id: proyectofacultad-service
          uri: lb://proyectofacultad-service
          predicates:
            - Path=/api/materias/**

eureka:
  client:
    service-url:
      #defaultZone: http://localhost:8761/eureka
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
