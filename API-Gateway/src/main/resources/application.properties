server.port=8090

spring.application.name=api-gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=usuario-server
spring.cloud.gateway.routes[0].uri=lb://usuario-server
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/usuarios/**
spring.cloud.gateway.routes[1].id=proyectofacultad-service
spring.cloud.gateway.routes[1].uri=lb://proyectofacultad-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/materias/**

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

#Las siguientes configuraciones se requieren para evitar errores cuando se está levantando el sistema,
#para que el Eureka Server conozca bien al API Gateway.
#Con esto hacemos Timeouts un poco más largos.
spring.cloud.gateway.httpclient.connect-timeout=1000
spring.cloud.gateway.httpclient.response-timeout=5s

#Con esto se trata de reconectar.
spring.cloud.gateway.loadbalancer.retry.enabled=true
spring.cloud.loadbalancer.retry.max-retries-on-next-service-instance=2
spring.cloud.loadbalancer.retry.max-retries-on-same-service-instance=1